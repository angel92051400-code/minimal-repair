<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 助教批改輔助系統 - 智慧最小修復工作台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0b0f17',
                        panelBg: '#121822',
                        borderMuted: '#243044'
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #0b0f17; color: #e2e8f0; font-family: 'Inter', sans-serif; }
        pre, code, textarea, .font-mono { font-family: 'Fira Code', monospace; }
        .code-sync { font-family: 'Fira Code', monospace !important; font-size: 14px !important; line-height: 1.6 !important; tab-size: 4 !important; white-space: pre !important; }
    </style>
</head>
<body class="min-h-screen bg-[#0b0f17] text-slate-100 p-4 md:p-6 flex flex-col justify-between">

    <!-- 頂部導覽列：API Key 直接內嵌在右上角 -->
    <header class="max-w-7xl mx-auto w-full mb-4">
        <div class="flex flex-wrap items-center justify-between gap-3 border-b border-borderMuted/60 pb-3">
            <div class="flex items-center space-x-3">
                <span class="p-2 rounded-lg bg-blue-500/10 border border-blue-500/20 text-blue-400">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                </span>
                <div>
                    <h1 class="text-base md:text-lg font-bold tracking-tight text-white flex items-center gap-2">
                        Python 程式批改輔助系統
                        <span class="text-xs px-2 py-0.5 rounded bg-blue-500/20 text-blue-300 border border-blue-500/30 font-mono">Gemini 3.8 Flash</span>
                    </h1>
                    <p class="text-xs text-slate-400">動態解析題目・算術與符號糾正・Minimal Repair 最小修復</p>
                </div>
            </div>

            <!-- 右上角 API Key 控制區 -->
            <div class="flex items-center gap-2 bg-[#121822] border border-borderMuted p-1.5 rounded-xl shadow-md">
                <span class="text-xs text-slate-400 pl-2 font-medium">🔑 API Key:</span>
                <input type="password" id="apiKeyInput" placeholder="請貼上 API Key..." autocomplete="off"
                    class="w-40 md:w-56 bg-[#090d13] border border-borderMuted rounded-lg px-2.5 py-1 text-xs text-slate-200 focus:outline-none focus:ring-1 focus:ring-blue-500 font-mono">
                <button type="button" onclick="saveApiKey()" 
                    class="px-3 py-1 bg-blue-600 hover:bg-blue-500 text-white rounded-lg text-xs font-medium transition cursor-pointer shadow">
                    儲存
                </button>
            </div>
        </div>

        <div class="flex items-center flex-wrap gap-2 text-xs pt-3">
            <span class="text-slate-400 font-medium">快速載入典型學生錯誤案例：</span>
            <button type="button" onclick="loadPreset('operator_error')" class="px-2.5 py-1 rounded-md bg-amber-950/60 text-amber-300 border border-amber-800 cursor-pointer">案例 1: 符號誤植 (+ 改 -)</button>
            <button type="button" onclick="loadPreset('prime_modulo_error')" class="px-2.5 py-1 rounded-md bg-blue-950/60 text-blue-300 border border-blue-800 cursor-pointer">案例 2: 質數判斷</button>
            <button type="button" onclick="loadPreset('tree_missing_print')" class="px-2.5 py-1 rounded-md bg-slate-800 text-slate-300 border border-slate-700 cursor-pointer">案例 3: 聖誕樹</button>
        </div>
    </header>

    <!-- 主工作區 -->
    <main class="max-w-7xl mx-auto w-full flex-1 flex flex-col gap-4">

        <section class="bg-panelBg border border-borderMuted rounded-xl p-4 shadow-lg">
            <label for="problemPrompt" class="text-xs md:text-sm font-semibold text-slate-300 flex items-center gap-2 mb-2">
                📜 題目說明與評量規範 (Problem Prompt):
            </label>
            <textarea id="problemPrompt" rows="2" 
                class="w-full bg-[#0d131e] text-slate-200 border border-borderMuted rounded-lg p-3 text-sm focus:outline-none focus:ring-1 focus:ring-blue-500 resize-none"
                placeholder="輸入題目要求與核心條件...">請撰寫一函式 sum_squares(n)，計算並回傳 1 到 n 所有整數的平方和 (1^2 + 2^2 + ... + n^2)。必須正確累加。</textarea>
        </section>

        <section class="grid grid-cols-1 md:grid-cols-2 gap-4 flex-1">
            
            <!-- 左欄：學生程式碼編輯器 -->
            <div class="flex flex-col bg-panelBg border border-borderMuted rounded-xl p-4 shadow-lg">
                <div class="flex items-center justify-between mb-2">
                    <label for="studentCode" class="text-xs md:text-sm font-semibold text-slate-200 flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-amber-400"></span> 學生程式碼 (貼上即自動解析):
                    </label>
                    <span id="typingIndicator" class="text-[11px] text-blue-400 font-mono hidden">AI 思考中...</span>
                </div>
                <div class="flex-1 min-h-[280px] flex">
                    <textarea id="studentCode" spellcheck="false"
                        class="code-sync w-full h-full bg-[#0a0f18] text-slate-200 border border-borderMuted rounded-lg p-3 focus:outline-none focus:ring-1 focus:ring-amber-500 resize-none"
                        placeholder="請在此貼上學生程式碼...">def sum_squares(n):
    total = 0
    for i in range(1, n + 1):
        total -= i * i  # 學生誤將 + 寫成 -
    return total</textarea>
                </div>
            </div>

            <!-- 右欄：Minimal Repair 最小修復區 -->
            <div class="flex flex-col bg-panelBg border border-borderMuted rounded-xl p-4 shadow-lg">
                <div class="flex items-center justify-between mb-2">
                    <div class="flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
                        <h2 class="text-xs md:text-sm font-semibold text-slate-200">Minimal Repair (最小修復對照)</h2>
                        <span id="repairStatusBadge" class="text-[10px] px-2 py-0.5 rounded bg-blue-500/20 text-blue-300 font-mono">準備就緒</span>
                    </div>
                    
                    <button type="button" onclick="copyRepairedCode()" class="text-xs px-2.5 py-1 rounded bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 cursor-pointer">
                        📋 複製修復代碼
                    </button>
                </div>

                <div class="flex-1 min-h-[280px] flex flex-col justify-between bg-[#0a0f18] border border-borderMuted rounded-lg p-3 overflow-hidden">
                    <div id="repairedCodeView" class="code-sync text-slate-200 overflow-auto flex-1"></div>
                    <div class="mt-2 pt-2 border-t border-borderMuted/40 flex items-center justify-between text-[11px] text-slate-500">
                        <span>保留原架構之最小修復</span>
                        <span id="diffStats" class="font-mono text-slate-400">0 處修復</span>
                    </div>
                </div>
            </div>

        </section>

        <!-- 錯因評語區 -->
        <section class="bg-panelBg border border-borderMuted rounded-xl p-4 shadow-lg">
            <div class="flex items-center justify-between mb-2">
                <label for="feedbackText" class="text-xs md:text-sm font-semibold text-slate-200 flex items-center gap-2">
                    💬 白話錯因分析與客觀評語 (助教一鍵複製):
                </label>
                <button type="button" onclick="copyFeedbackText()" class="px-3 py-1.5 rounded-lg bg-blue-600 hover:bg-blue-500 text-white text-xs font-medium cursor-pointer">
                    ✨ 一鍵複製評語
                </button>
            </div>
            <textarea id="feedbackText" rows="2"
                class="w-full bg-[#0d131e] text-amber-200/90 border border-borderMuted rounded-lg p-3 text-sm focus:outline-none resize-none leading-relaxed"
                placeholder="分析後將在此自動生成精確評語..."></textarea>
        </section>

    </main>

    <!-- Toast 提示 -->
    <div id="toast" class="fixed bottom-6 right-6 px-4 py-2.5 rounded-lg bg-emerald-600 text-white text-xs font-medium shadow-xl transform translate-y-20 opacity-0 transition-all duration-300 pointer-events-none z-50">
        已複製至剪貼簿！
    </div>

    <script>
        const PRESETS = {
            operator_error: {
                prompt: "請撰寫一函式 sum_squares(n)，計算並回傳 1 到 n 所有整數的平方和 (1^2 + 2^2 + ... + n^2)。必須正確累加。",
                student: `def sum_squares(n):\n    total = 0\n    for i in range(1, n + 1):\n        total -= i * i  # 學生誤將 + 寫成 -\n    return total`
            },
            prime_modulo_error: {
                prompt: "寫一個程式印出 100 以內的所有質數 (Prime Numbers)",
                student: `primes = []\n\nfor num in range(2, 100):\n    is_prime = True\n    for i in range(2, int(num**0.5) + 1):\n        if num % i == 1:\n            is_prime = False\n            break\n    if is_prime:\n        primes.append(num)\n\nprint(primes)`
            },
            tree_missing_print: {
                prompt: "請用字元 '*' 印出一個 5 層的聖誕樹圖案。",
                student: `layers = 5\n\nfor i in range(1, layers + 1):\n    spaces = ' ' * (layers - i)\n    stars = '*' * (2 * i - 1)`
            }
        };

        const apiKeyInput = document.getElementById('apiKeyInput');
        const studentCodeEl = document.getElementById('studentCode');
        const repairedCodeViewEl = document.getElementById('repairedCodeView');
        const feedbackTextEl = document.getElementById('feedbackText');
        const problemPromptEl = document.getElementById('problemPrompt');
        const typingIndicator = document.getElementById('typingIndicator');

        let latestRepairedRawCode = "";

        window.addEventListener('DOMContentLoaded', () => {
            const savedKey = localStorage.getItem('gemini_api_key');
            if (savedKey) {
                apiKeyInput.value = savedKey;
                runAiAnalysis();
            }
        });

        function saveApiKey() {
            const key = apiKeyInput.value.trim();
            if (!key) {
                alert("請輸入有效的 API Key！");
                apiKeyInput.focus();
                return;
            }
            localStorage.setItem('gemini_api_key', key);
            showToast("API Key 儲存成功！");
            runAiAnalysis();
        }

        let debounceTimer;
        studentCodeEl.addEventListener('input', () => {
            typingIndicator.classList.remove('hidden');
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(() => runAiAnalysis(), 600);
        });

        async function runAiAnalysis() {
            const apiKey = localStorage.getItem('gemini_api_key') || apiKeyInput.value.trim();
            if (!apiKey) {
                repairedCodeViewEl.innerHTML = '<span class="text-amber-400"># 請先在右上角輸入並儲存 Gemini API Key...</span>';
                return;
            }

            const rawCode = studentCodeEl.value;
            if (!rawCode.trim()) {
                latestRepairedRawCode = "";
                repairedCodeViewEl.innerHTML = '<span class="text-slate-500"># 請輸入學生代碼...</span>';
                feedbackTextEl.value = "尚未輸入代碼。";
                typingIndicator.classList.add('hidden');
                return;
            }

            document.getElementById('repairStatusBadge').textContent = "AI 閱讀中...";
            document.getElementById('repairStatusBadge').className = "text-[10px] px-2 py-0.5 rounded bg-blue-500/20 text-blue-300 font-mono animate-pulse";

            try {
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;
                const systemPrompt = `你是一位專業且精準的 Python 助教。請針對學生的程式碼與題目規範執行「最小修復（Minimal Repair）」：
1. 找出邏輯、算術符號（如 + 寫成 -）或語法錯誤並修正。
2. 保留原變數名稱與架構。
3. 嚴格以純 JSON 格式回傳（無 markdown），包含四個欄位：
- "repairedCode": 修復後的完整 Python 程式碼。
- "status": 狀態標籤（例如 "運算符號誤植 (-3分)"）。
- "stats": 修改統計（例如 "將 -= 改為 += (1 處修復)"）。
- "feedback": 繁體中文白話錯因評語。`;

                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ role: "user", parts: [{ text: `【題目】：\n${problemPrompt.value}\n\n【學生代碼】：\n${rawCode}` }] }],
                        systemInstruction: { parts: [{ text: systemPrompt }] },
                        generationConfig: { temperature: 0.1 }
                    })
                });

                if (!response.ok) {
                    const errJson = await response.json().catch(() => ({}));
                    throw new Error(errJson.error?.message || `HTTP ${response.status}`);
                }

                const data = await response.json();
                let text = data.candidates?.[0]?.content?.parts?.[0]?.text || "{}";
                text = text.replace(/^```json/, "").replace(/^```/, "").replace(/```$/, "").trim();
                
                const result = JSON.parse(text);
                latestRepairedRawCode = result.repairedCode;
                renderDiff(rawCode, result.repairedCode);
                feedbackTextEl.value = result.feedback;
                document.getElementById('diffStats').textContent = result.stats;
                document.getElementById('repairStatusBadge').textContent = result.status;
                document.getElementById('repairStatusBadge').className = "text-[10px] px-2 py-0.5 rounded bg-amber-500/20 text-amber-300 font-mono";

            } catch (err) {
                console.error(err);
                document.getElementById('repairStatusBadge').textContent = "呼叫失敗";
                document.getElementById('repairStatusBadge').className = "text-[10px] px-2 py-0.5 rounded bg-red-500/20 text-red-300 font-mono";
                feedbackTextEl.value = `【錯誤診斷】：${err.message}\n請檢查右上角 API Key 是否正確。`;
            } finally {
                typingIndicator.classList.add('hidden');
            }
        }

        function renderDiff(orig, rep) {
            const oLines = orig.split('\n');
            const rLines = rep.split('\n');
            const html = rLines.map((line, idx) => {
                const esc = line.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;') || '&nbsp;';
                const isDiff = !oLines[idx] || oLines[idx].trimEnd() !== line.trimEnd();
                if (isDiff) {
                    return `<div class="bg-[#3d161a]/90 text-[#f87171] font-semibold px-1 border-l-2 border-red-500">${esc}</div>`;
                }
                return `<div class="px-1 text-slate-300">${esc}</div>`;
            });
            repairedCodeViewEl.innerHTML = html.join('');
        }

        function loadPreset(key) {
            const p = PRESETS[key];
            if (!p) return;
            problemPromptEl.value = p.prompt;
            studentCodeEl.value = p.student;
            runAiAnalysis();
            showToast("已載入預設案例！");
        }

        function copyRepairedCode() {
            execCopy(latestRepairedRawCode || repairedCodeViewEl.textContent, "已複製修復代碼！");
        }

        function copyFeedbackText() {
            execCopy(feedbackTextEl.value, "已複製學生評語！");
        }

        function execCopy(text, msg) {
            const ta = document.createElement('textarea');
            ta.value = text;
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
            showToast(msg);
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.remove('translate-y-20', 'opacity-0');
            t.classList.add('translate-y-0', 'opacity-100');
            setTimeout(() => {
                t.classList.remove('translate-y-0', 'opacity-100');
                t.classList.add('translate-y-20', 'opacity-0');
            }, 1800);
        }
    </script>
</body>
</html>
