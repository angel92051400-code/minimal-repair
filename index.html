<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 助教批改輔助系統 - 最小修復評量工作台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#090d13',
                        panelBg: '#121822',
                        cardBg: '#161e2e',
                        borderMuted: '#243044',
                        accentBlue: '#3b82f6',
                        diffRed: '#3d161a',
                        diffTextRed: '#f87171'
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        mono: ['"Fira Code"', 'monospace']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #0b0f17;
            color: #e2e8f0;
            font-family: 'Inter', sans-serif;
        }
        pre, code, textarea, .font-mono {
            font-family: 'Fira Code', monospace;
        }
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: #27354a;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #3b82f6;
        }
        /* 左右兩側字體大小、行高、tab 寬度完全鏡像鎖定 */
        .code-sync {
            font-family: 'Fira Code', monospace !important;
            font-size: 13px !important;
            line-height: 1.6 !important;
            tab-size: 4 !important;
            white-space: pre !important;
        }
        @media (min-width: 768px) {
            .code-sync {
                font-size: 14px !important;
            }
        }
    </style>
</head>
<body class="min-h-screen bg-[#0b0f17] text-slate-100 p-3 md:p-6 flex flex-col justify-between">

    <header class="max-w-7xl mx-auto w-full mb-4">
        <div class="flex flex-wrap items-center justify-between gap-3 border-b border-borderMuted/60 pb-3">
            <div class="flex items-center space-x-3">
                <span class="p-2 rounded-lg bg-blue-500/10 border border-blue-500/20 text-blue-400">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4" />
                    </svg>
                </span>
                <div>
                    <h1 class="text-base md:text-lg font-bold tracking-tight text-white flex items-center gap-2">
                        Python 程式批改輔助系統
                        <span class="text-xs px-2 py-0.5 rounded bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 font-mono font-medium">Minimal Repair Engine</span>
                    </h1>
                    <p class="text-xs text-slate-400">保留學生原始邏輯・最小幅度修正・快速診斷評語生成</p>
                </div>
            </div>

            <!-- API Key Input & Status -->
            <div class="flex items-center flex-wrap gap-2 text-xs">
                <div class="flex items-center gap-2 bg-[#0d131e] border border-borderMuted px-3 py-1.5 rounded-lg">
                    <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse" id="aiStatusDot"></span>
                    <span class="text-slate-300 font-medium">API Key:</span>
                    <input type="password" id="apiKeyInput" placeholder="可貼入 Gemini API Key (可空)" 
                        class="bg-[#161e2e] text-slate-200 text-xs px-2 py-0.5 rounded border border-borderMuted focus:outline-none focus:ring-1 focus:ring-blue-500 w-36 font-mono">
                    <button type="button" onclick="saveApiKey()" class="text-[11px] px-2 py-0.5 rounded bg-blue-600 hover:bg-blue-500 text-white font-medium transition">儲存</button>
                </div>
            </div>
        </div>

        <div class="flex items-center flex-wrap gap-2 text-xs pt-3">
            <span class="text-slate-400 font-medium">快速載入典型學生錯誤案例：</span>
            <button type="button" onclick="loadPreset('prime_modulo_error')" class="px-2.5 py-1 rounded-md bg-amber-950/60 hover:bg-amber-900/60 text-amber-300 border border-amber-800 transition">
                案例 1: 質數判斷 (餘數誤寫 == 1)
            </button>
            <button type="button" onclick="loadPreset('tree_missing_print')" class="px-2.5 py-1 rounded-md bg-blue-950/60 hover:bg-blue-900/60 text-blue-300 border border-blue-800 transition">
                案例 2: 聖誕樹 (缺少 print)
            </button>
            <button type="button" onclick="loadPreset('missing_loop')" class="px-2.5 py-1 rounded-md bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 transition">
                案例 3: 平方和 (缺少迴圈結構)
            </button>
            <button type="button" onclick="triggerManualAnalysis()" id="analyzeBtn" class="ml-auto px-3.5 py-1.5 rounded-md bg-blue-600 hover:bg-blue-500 text-white font-medium shadow-md shadow-blue-600/20 transition flex items-center gap-1.5">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                <span>立即由 AI 診斷修復</span>
            </button>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="max-w-7xl mx-auto w-full flex-1 flex flex-col gap-4">

        <section class="bg-panelBg/90 border border-borderMuted rounded-xl p-4 shadow-lg backdrop-blur-sm">
            <div class="flex items-center justify-between mb-2">
                <label for="problemPrompt" class="text-xs md:text-sm font-semibold text-slate-300 flex items-center gap-2">
                    <svg class="w-4 h-4 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                    </svg>
                    題目說明與評量規範 (Problem Prompt):
                </label>
                <span class="text-xs text-slate-400">助教可輸入當週作業題目或評分規範</span>
            </div>
            <textarea id="problemPrompt" rows="2" 
                class="w-full bg-[#0d131e] text-slate-200 border border-borderMuted rounded-lg p-3 text-sm focus:outline-none focus:ring-1 focus:ring-blue-500 focus:border-blue-500 transition font-sans resize-none"
                placeholder="輸入題目要求與核心條件...">請撰寫一函式 sum_squares(n)，計算並回傳 1 到 n 所有整數的平方和 (1^2 + 2^2 + ... + n^2)。【要求】：必須使用迴圈結構 (for 或 while) 進行累加。</textarea>
        </section>

        <section class="grid grid-cols-1 md:grid-cols-2 gap-4 flex-1 min-w-0">
            
            <!-- Left Column: Student Code Editor -->
            <div class="flex flex-col bg-panelBg/90 border border-borderMuted rounded-xl p-3 md:p-4 shadow-lg backdrop-blur-sm min-w-0">
                <div class="h-8 flex items-center justify-between mb-2">
                    <label for="studentCode" class="text-xs md:text-sm font-semibold text-slate-200 flex items-center gap-2 truncate">
                        <span class="w-2.5 h-2.5 rounded-full bg-amber-400 shrink-0"></span>
                        <span class="truncate">學生程式碼 Student Code (可即時編輯):</span>
                    </label>
                    <div class="flex items-center gap-2 shrink-0">
                        <span id="typingIndicator" class="text-[11px] text-slate-400 font-mono hidden">診斷中...</span>
                        <button type="button" onclick="clearStudentCode()" class="text-xs px-2 py-1 rounded bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-red-400 border border-slate-700 transition flex items-center gap-1">
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                            清空
                        </button>
                    </div>
                </div>

                <div class="flex-1 min-h-[260px] md:min-h-[320px] flex">
                    <textarea id="studentCode" spellcheck="false"
                        class="code-sync w-full h-full bg-[#0a0f18] text-slate-200 border border-borderMuted rounded-lg p-3 focus:outline-none focus:ring-1 focus:ring-amber-500/70 focus:border-amber-500/70 resize-none transition"
                        placeholder="請在此貼上學生提交的 Python 原始程式碼...">def sum_squares(n):
    total = n * n
    return total</textarea>
                </div>
            </div>

            <!-- Right Column: Minimal Repair Reference Answer -->
            <div class="flex flex-col bg-panelBg/90 border border-borderMuted rounded-xl p-3 md:p-4 shadow-lg backdrop-blur-sm min-w-0">
                <div class="h-8 flex items-center justify-between mb-2">
                    <div class="flex items-center gap-2 min-w-0">
                        <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 shrink-0"></span>
                        <h2 class="text-xs md:text-sm font-semibold text-slate-200 truncate">
                            Minimal Repair (最小修復對照)
                        </h2>
                        <span id="repairStatusBadge" class="text-[11px] px-2 py-0.5 rounded bg-blue-500/20 text-blue-300 font-mono border border-blue-500/30 shrink-0 truncate">診斷中</span>
                    </div>
                    
                    <button type="button" onclick="copyRepairedCode()" id="copyCodeBtn"
                        class="text-xs px-2.5 py-1 rounded bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white border border-slate-700 transition flex items-center gap-1 shrink-0">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
                        </svg>
                        <span id="copyCodeText">複製修復程式碼</span>
                    </button>
                </div>

                <div class="flex-1 min-h-[260px] md:min-h-[320px] flex flex-col justify-between bg-[#0a0f18] border border-borderMuted rounded-lg p-3 overflow-hidden">
                    <div id="repairedCodeView" class="code-sync text-slate-200 overflow-auto flex-1"></div>
                    
                    <div class="mt-2 pt-2 border-t border-borderMuted/40 flex items-center justify-between text-[11px] text-slate-500">
                        <span class="truncate">保留原變數命名與邏輯結構之最小修復</span>
                        <span id="diffStats" class="font-mono text-slate-400 shrink-0 ml-1">0 處修復</span>
                    </div>
                </div>
            </div>

        </section>

        <section class="bg-panelBg/90 border border-borderMuted rounded-xl p-4 shadow-lg backdrop-blur-sm">
            <div class="flex items-center justify-between mb-2">
                <div class="flex items-center gap-2">
                    <svg class="w-4 h-4 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                    </svg>
                    <label for="feedbackText" class="text-xs md:text-sm font-semibold text-slate-200">
                        白話錯因分析與客觀評語 (助教可一鍵複製貼回教務/成績系統):
                    </label>
                </div>

                <button type="button" onclick="copyFeedbackText()" id="copyFeedbackBtn"
                    class="px-3 py-1.5 rounded-lg bg-blue-600 hover:bg-blue-500 text-white text-xs font-medium shadow-md shadow-blue-600/20 transition flex items-center gap-1.5">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
                    </svg>
                    <span id="copyFeedbackText">一鍵複製評語</span>
                </button>
            </div>

            <div class="relative">
                <textarea id="feedbackText" rows="2"
                    class="w-full bg-[#0d131e] text-amber-200/90 border border-borderMuted rounded-lg p-3 text-sm focus:outline-none focus:ring-1 focus:ring-blue-500 font-sans resize-none leading-relaxed transition"
                    placeholder="分析後將在此自動生成簡明精確的錯因回饋..."></textarea>
            </div>
        </section>

    </main>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-6 right-6 px-4 py-2.5 rounded-lg bg-emerald-600 text-white text-xs font-medium shadow-xl flex items-center gap-2 transform translate-y-20 opacity-0 transition-all duration-300 pointer-events-none z-50">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
        </svg>
        <span id="toastMsg">已複製至剪貼簿！</span>
    </div>

    <script>
        const PRESETS = {
            prime_modulo_error: {
                prompt: "寫一個程式印出 100 以內的所有質數 (Prime Numbers)。",
                student: `primes = []\n\nfor num in range(2, 100):\n    is_prime = True\n    for i in range(2, int(num**0.5) + 1):\n        if num % i == 1:\n            is_prime = False\n            break\n    if is_prime:\n        primes.append(num)\n\nprint(primes)`
            },
            tree_missing_print: {
                prompt: "請用字元 '*' 印出一個 5 層的聖誕樹圖案。",
                student: `layers = 5  # 定義樹的層數\n\nfor i in range(1, layers + 1):\n    spaces = ' ' * (layers - i)\n    stars = '*' * (2 * i - 1)`
            },
            missing_loop: {
                prompt: "請撰寫一函式 sum_squares(n)，計算並回傳 1 到 n 所有整數的平方和 (1^2 + 2^2 + ... + n^2)。【要求】：必須使用迴圈結構 (for 或 while) 進行累加。",
                student: `def sum_squares(n):\n    total = n * n\n    return total`
            }
        };

        const studentCodeEl = document.getElementById('studentCode');
        const repairedCodeViewEl = document.getElementById('repairedCodeView');
        const feedbackTextEl = document.getElementById('feedbackText');
        const problemPromptEl = document.getElementById('problemPrompt');
        const diffStatsEl = document.getElementById('diffStats');
        const typingIndicator = document.getElementById('typingIndicator');
        const analyzeBtn = document.getElementById('analyzeBtn');
        const apiKeyInputEl = document.getElementById('apiKeyInput');

        let latestRepairedRawCode = "";

        window.addEventListener('DOMContentLoaded', () => {
            const savedKey = localStorage.getItem('gemini_api_key') || "";
            if (savedKey) apiKeyInputEl.value = savedKey;
            runMinimalRepairEngine();
        });

        function saveApiKey() {
            const key = apiKeyInputEl.value.trim();
            localStorage.setItem('gemini_api_key', key);
            showToast("API Key 已更新並儲存至本機！");
            runMinimalRepairEngine();
        }

        function triggerManualAnalysis() {
            runMinimalRepairEngine(true);
        }

        function renderDiffHighlight(originalCode, repairedCode) {
            const origLines = originalCode.split('\n');
            const repLines = repairedCode.split('\n');

            const m = origLines.length;
            const n = repLines.length;
            const dp = Array.from({ length: m + 1 }, () => new Uint16Array(n + 1));

            for (let i = 0; i < m; i++) {
                for (let j = 0; j < n; j++) {
                    if (origLines[i].trimEnd() === repLines[j].trimEnd()) {
                        dp[i + 1][j + 1] = dp[i][j] + 1;
                    } else {
                        dp[i + 1][j + 1] = Math.max(dp[i + 1][j], dp[i][j + 1]);
                    }
                }
            }

            let i = m, j = n;
            const isRepairedLineModified = new Array(n).fill(true);

            while (i > 0 && j > 0) {
                if (origLines[i - 1].trimEnd() === repLines[j - 1].trimEnd()) {
                    isRepairedLineModified[j - 1] = false;
                    i--;
                    j--;
                } else if (dp[i - 1][j] >= dp[i][j - 1]) {
                    i--;
                } else {
                    j--;
                }
            }

            const htmlLines = repLines.map((line, idx) => {
                const escapedLine = line
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;') || '&nbsp;';

                if (isRepairedLineModified[idx]) {
                    return `<div class="bg-[#3d161a]/90 text-[#f87171] font-semibold px-1 rounded-sm border-l-2 border-red-500">${escapedLine}</div>`;
                } else {
                    return `<div class="px-1 text-slate-300">${escapedLine}</div>`;
                }
            });

            repairedCodeViewEl.innerHTML = htmlLines.join('');
        }

        async function runMinimalRepairEngine(forceNotify = false) {
            const rawCode = studentCodeEl.value;
            const trimmed = rawCode.trim();
            const promptText = problemPromptEl ? problemPromptEl.value : "";

            if (!trimmed) {
                latestRepairedRawCode = "";
                repairedCodeViewEl.innerHTML = '<span class="text-slate-500"># 請在左側輸入學生作答代碼...</span>';
                feedbackTextEl.value = "尚未輸入代碼。";
                updateStatusBadge("待輸入", "text-[11px] px-2 py-0.5 rounded bg-slate-800 text-slate-400 font-mono border border-slate-700");
                diffStatsEl.textContent = "0 處修復";
                return;
            }

            typingIndicator.textContent = "AI 最小修復診斷中...";
            typingIndicator.classList.remove('hidden');
            updateStatusBadge("診斷中...", "text-[11px] px-2 py-0.5 rounded bg-blue-500/20 text-blue-300 font-mono border border-blue-500/30 animate-pulse");
            if (analyzeBtn) analyzeBtn.disabled = true;

            const apiKey = apiKeyInputEl.value.trim() || localStorage.getItem('gemini_api_key');

            if (apiKey) {
                try {
                    const result = await callDirectGeminiEngine(apiKey, promptText, rawCode);
                    applyRepairResult(result.repairedCode, result.status, result.stats, result.feedback);
                    if (forceNotify) showToast("Gemini 最小修復診斷完成！");
                } catch (err) {
                    console.error("Gemini API error:", err);
                    fallbackHeuristic(rawCode, promptText);
                } finally {
                    typingIndicator.classList.add('hidden');
                    if (analyzeBtn) analyzeBtn.disabled = false;
                }
            } else {
                setTimeout(() => {
                    fallbackHeuristic(rawCode, promptText);
                    typingIndicator.classList.add('hidden');
                    if (analyzeBtn) analyzeBtn.disabled = false;
                    if (forceNotify) showToast("已使用內部智慧啟發規則進行診斷！");
                }, 400);
            }
        }

        async function callDirectGeminiEngine(apiKey, problemPrompt, studentCode) {
            // 使用最新穩定版 gemini-3.8-flash 確保高速度與相容性
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${apiKey}`;

            const systemPrompt = `你是一位專業且極度客觀的 Python 程式設計課助教。
你的批改準則是「最小修復（Minimal Repair）」：
1. 嚴格保留學生原本的所有邏輯架構、變數名稱、縮排風格與演算法思維。
2. 尋找讓程式能正確通過測試的最少字元或行數修改。
3. 找出真正的邏輯漏洞（如餘數條件、縮排、邊界、缺輸出 print、缺少迴圈等）。
4. feedback 必須是一至兩句簡潔客觀的白話說明，方便助教直接複製貼回成績系統。`;

            const userPrompt = `【題目要求與規範】：
${problemPrompt || "無特定題目，請依據程式上下文判定預期功能並修復語法/邏輯錯誤"}

【學生提交的原始程式碼】：
${studentCode}

請依據「最小修復」準則分析此代碼，回傳修正後代碼、扣分狀態、修改幅度與簡潔評語。`;

            const payload = {
                contents: [{ role: "user", parts: [{ text: userPrompt }] }],
                systemInstruction: { parts: [{ text: systemPrompt }] },
                generationConfig: {
                    responseMimeType: "application/json",
                    responseSchema: {
                        type: "OBJECT",
                        properties: {
                            "repairedCode": { "type": "STRING" },
                            "status": { "type": "STRING" },
                            "stats": { "type": "STRING" },
                            "feedback": { "type": "STRING" }
                        },
                        required: ["repairedCode", "status", "stats", "feedback"]
                    }
                }
            };

            const response = await fetch(apiUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }

            const result = await response.json();
            const text = result.candidates?.[0]?.content?.parts?.[0]?.text;
            return JSON.parse(text);
        }

        function fallbackHeuristic(rawCode, promptText) {
            if (rawCode.includes('%') && rawCode.includes('== 1')) {
                const repaired = rawCode.replace(/==\s*1/g, '== 0');
                applyRepairResult(
                    repaired,
                    "整除餘數判斷錯誤 (-3分)",
                    "將 == 1 改為 == 0 (1 處修復)",
                    "【扣分原因】：因數整除條件應為餘數為 0 (`num % i == 0`)，原程式誤寫為 `== 1`。只需將 1 改為 0 即可正確過濾質數。"
                );
            } else if (rawCode.includes('stars =') && !rawCode.includes('print(')) {
                const repaired = rawCode + "\n    print(spaces + stars)";
                applyRepairResult(
                    repaired,
                    "迴圈缺少輸出語句 (-2分)",
                    "新增 1 行 print(spaces + stars)",
                    "【扣分原因】：迴圈內已組裝好空格與星號字串，但缺少 `print()` 輸出，導致畫面上沒有印出樹狀圖。"
                );
            } else if (rawCode.includes('def sum_squares') && !rawCode.includes('for') && !rawCode.includes('while')) {
                const repaired = `def sum_squares(n):\n    total = 0\n    for i in range(1, n + 1):\n        total += i * i\n    return total`;
                applyRepairResult(
                    repaired,
                    "未依要求使用迴圈 (-10分)",
                    "加入 for 迴圈逐一累加 (3 行修復)",
                    "【扣分原因】：題目要求必須使用迴圈結構進行累加，原程式僅計算 `n * n`，未做 1 到 n 的連續平方累加。"
                );
            } else {
                applyRepairResult(
                    rawCode,
                    "程式邏輯完整 (滿分)",
                    "0 處變動",
                    "【評語】：語法與邏輯正確，符合題目規範要求。"
                );
            }
        }

        function updateStatusBadge(statusText, className) {
            const repairStatusBadgeEl = document.getElementById('repairStatusBadge');
            if (repairStatusBadgeEl) {
                repairStatusBadgeEl.textContent = statusText;
                if (className) repairStatusBadgeEl.className = className;
            }
        }

        function applyRepairResult(repairedCode, statusBadge, statsText, feedbackText) {
            latestRepairedRawCode = repairedCode;
            renderDiffHighlight(studentCodeEl.value, repairedCode);
            feedbackTextEl.value = feedbackText;
            diffStatsEl.textContent = statsText;

            let badgeClass = "text-[11px] px-2 py-0.5 rounded bg-blue-500/20 text-blue-300 font-mono border border-blue-500/30 shrink-0 truncate";
            if (statusBadge.includes('滿分')) {
                badgeClass = "text-[11px] px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-300 font-mono border border-emerald-500/30 shrink-0 truncate";
            } else if (statusBadge.includes('-') || statusBadge.includes('錯誤')) {
                badgeClass = "text-[11px] px-2 py-0.5 rounded bg-amber-500/20 text-amber-300 font-mono border border-amber-500/30 shrink-0 truncate";
            }
            updateStatusBadge(statusBadge, badgeClass);
        }

        function loadPreset(presetKey) {
            const p = PRESETS[presetKey];
            if (!p) return;
            if (p.prompt && problemPromptEl) problemPromptEl.value = p.prompt;
            studentCodeEl.value = p.student;
            runMinimalRepairEngine();
            showToast("已載入預設案例並進行診斷！");
        }

        function clearStudentCode() {
            studentCodeEl.value = "";
            runMinimalRepairEngine();
            studentCodeEl.focus();
        }

        let debounceTimer;
        studentCodeEl.addEventListener('input', () => {
            typingIndicator.textContent = "準備分析中...";
            typingIndicator.classList.remove('hidden');
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(() => {
                runMinimalRepairEngine();
            }, 600);
        });

        function copyRepairedCode() {
            const codeToCopy = latestRepairedRawCode || repairedCodeViewEl.textContent;
            executeCopy(codeToCopy, "已複製修復程式碼！");
            
            const btnText = document.getElementById('copyCodeText');
            btnText.textContent = "已複製！";
            setTimeout(() => { btnText.textContent = "複製修復程式碼"; }, 1800);
        }

        function copyFeedbackText() {
            const textToCopy = feedbackTextEl.value;
            executeCopy(textToCopy, "已複製學生錯因評語！");

            const btnText = document.getElementById('copyFeedbackText');
            btnText.textContent = "已複製評語！";
            setTimeout(() => { btnText.textContent = "一鍵複製評語"; }, 1800);
        }

        function executeCopy(text, toastMessage) {
            try {
                const textarea = document.createElement('textarea');
                textarea.value = text;
                textarea.style.position = 'fixed';
                textarea.style.opacity = '0';
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                showToast(toastMessage);
            } catch (err) {
                console.error("Copy failed", err);
            }
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            toastMsg.textContent = msg;
            toast.classList.remove('translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');
            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 2000);
        }
    </script>
</body>
</html>
