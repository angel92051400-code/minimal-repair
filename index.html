<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 助教批改輔助系統 - 最小修復評量工作台 (秒改極速版)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#090d13',
                        panelBg: '#121822',
                        cardBg: '#161e2e',
                        borderMuted: '#243044',
                        accentBlue: '#3b82f6',
                        diffRed: '#3d161a',
                        diffTextRed: '#f87171'
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        mono: ['"Fira Code"', 'monospace']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #0b0f17;
            color: #e2e8f0;
            font-family: 'Inter', sans-serif;
        }
        pre, code, textarea, .font-mono {
            font-family: 'Fira Code', monospace;
        }
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: #27354a;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #3b82f6;
        }
        .code-sync {
            font-family: 'Fira Code', monospace !important;
            font-size: 13px !important;
            line-height: 1.6 !important;
            tab-size: 4 !important;
            white-space: pre !important;
        }
        @media (min-width: 768px) {
            .code-sync {
                font-size: 14px !important;
            }
        }
    </style>
</head>
<body class="min-h-screen bg-[#0b0f17] text-slate-100 p-3 md:p-6 flex flex-col justify-between">

    <header class="max-w-7xl mx-auto w-full mb-4">
        <div class="flex flex-wrap items-center justify-between gap-3 border-b border-borderMuted/60 pb-3">
            <div class="flex items-center space-x-3">
                <span class="p-2 rounded-lg bg-emerald-500/10 border border-emerald-500/20 text-emerald-400">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
                    </svg>
                </span>
                <div>
                    <h1 class="text-base md:text-lg font-bold tracking-tight text-white flex items-center gap-2">
                        Python 程式批改輔助系統
                        <span class="text-xs px-2 py-0.5 rounded bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 font-mono font-medium">⚡ 0秒本地秒改引擎</span>
                    </h1>
                    <p class="text-xs text-slate-400">免填 API Key・極速規則比對・即時標記錯誤與評語生成</p>
                </div>
            </div>

            <div class="flex items-center gap-2 text-xs text-emerald-400 bg-emerald-950/40 border border-emerald-800/60 px-3 py-1.5 rounded-lg">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                <span>系統就緒：完全免聯網、秒速響應</span>
            </div>
        </div>

        <div class="flex items-center flex-wrap gap-2 text-xs pt-3">
            <span class="text-slate-400 font-medium">快速載入典型學生錯誤案例：</span>
            <button type="button" onclick="loadPreset('prime_modulo_error')" class="px-2.5 py-1 rounded-md bg-amber-950/60 hover:bg-amber-900/60 text-amber-300 border border-amber-800 transition">
                案例 1: 質數判斷 (餘數誤寫 == 1)
            </button>
            <button type="button" onclick="loadPreset('tree_missing_print')" class="px-2.5 py-1 rounded-md bg-blue-950/60 hover:bg-blue-900/60 text-blue-300 border border-blue-800 transition">
                案例 2: 聖誕樹 (缺少 print)
            </button>
            <button type="button" onclick="loadPreset('missing_loop')" class="px-2.5 py-1 rounded-md bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 transition">
                案例 3: 平方和 (缺少迴圈結構)
            </button>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="max-w-7xl mx-auto w-full flex-1 flex flex-col gap-4">

        <section class="bg-panelBg/90 border border-borderMuted rounded-xl p-4 shadow-lg backdrop-blur-sm">
            <div class="flex items-center justify-between mb-2">
                <label for="problemPrompt" class="text-xs md:text-sm font-semibold text-slate-300 flex items-center gap-2">
                    <svg class="w-4 h-4 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                    </svg>
                    題目說明與評量規範 (Problem Prompt):
                </label>
                <span class="text-xs text-slate-400">助教可輸入當週作業題目或評分規範</span>
            </div>
            <textarea id="problemPrompt" rows="2" 
                class="w-full bg-[#0d131e] text-slate-200 border border-borderMuted rounded-lg p-3 text-sm focus:outline-none focus:ring-1 focus:ring-blue-500 font-sans resize-none"
                placeholder="輸入題目要求與核心條件...">請撰寫一函式 sum_squares(n)，計算並回傳 1 到 n 所有整數的平方和 (1^2 + 2^2 + ... + n^2)。【要求】：必須使用迴圈結構 (for 或 while) 進行累加。</textarea>
        </section>

        <section class="grid grid-cols-1 md:grid-cols-2 gap-4 flex-1 min-w-0">
            
            <!-- Left Column: Student Code Editor -->
            <div class="flex flex-col bg-panelBg/90 border border-borderMuted rounded-xl p-3 md:p-4 shadow-lg backdrop-blur-sm min-w-0">
                <div class="h-8 flex items-center justify-between mb-2">
                    <label for="studentCode" class="text-xs md:text-sm font-semibold text-slate-200 flex items-center gap-2 truncate">
                        <span class="w-2.5 h-2.5 rounded-full bg-amber-400 shrink-0"></span>
                        <span class="truncate">學生程式碼 Student Code (貼上即秒改):</span>
                    </label>
                    <button type="button" onclick="clearStudentCode()" class="text-xs px-2 py-1 rounded bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-red-400 border border-slate-700 transition flex items-center gap-1">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                        清空
                    </button>
                </div>

                <div class="flex-1 min-h-[260px] md:min-h-[320px] flex">
                    <textarea id="studentCode" spellcheck="false"
                        class="code-sync w-full h-full bg-[#0a0f18] text-slate-200 border border-borderMuted rounded-lg p-3 focus:outline-none focus:ring-1 focus:ring-amber-500/75 resize-none transition"
                        placeholder="請在此貼上學生提交的 Python 原始程式碼...">def sum_squares(n):
    total = n * n
    return total</textarea>
                </div>
            </div>

            <!-- Right Column: Minimal Repair Reference Answer -->
            <div class="flex flex-col bg-panelBg/90 border border-borderMuted rounded-xl p-3 md:p-4 shadow-lg backdrop-blur-sm min-w-0">
                <div class="h-8 flex items-center justify-between mb-2">
                    <div class="flex items-center gap-2 min-w-0">
                        <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 shrink-0"></span>
                        <h2 class="text-xs md:text-sm font-semibold text-slate-200 truncate">
                            Minimal Repair (最小修復對照)
                        </h2>
                        <span id="repairStatusBadge" class="text-[11px] px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-300 font-mono border border-emerald-500/30 shrink-0">⚡ 0秒秒改就緒</span>
                    </div>
                    
                    <button type="button" onclick="copyRepairedCode()" id="copyCodeBtn"
                        class="text-xs px-2.5 py-1 rounded bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white border border-slate-700 transition flex items-center gap-1 shrink-0">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
                        </svg>
                        <span id="copyCodeText">複製修復程式碼</span>
                    </button>
                </div>

                <div class="flex-1 min-h-[260px] md:min-h-[320px] flex flex-col justify-between bg-[#0a0f18] border border-borderMuted rounded-lg p-3 overflow-hidden">
                    <div id="repairedCodeView" class="code-sync text-slate-200 overflow-auto flex-1"></div>
                    
                    <div class="mt-2 pt-2 border-t border-borderMuted/40 flex items-center justify-between text-[11px] text-slate-500">
                        <span class="truncate">本地端光速規則引擎比對</span>
                        <span id="diffStats" class="font-mono text-slate-400 shrink-0 ml-1">0 處修復</span>
                    </div>
                </div>
            </div>

        </section>

        <section class="bg-panelBg/90 border border-borderMuted rounded-xl p-4 shadow-lg backdrop-blur-sm">
            <div class="flex items-center justify-between mb-2">
                <div class="flex items-center gap-2">
                    <svg class="w-4 h-4 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                    </svg>
                    <label for="feedbackText" class="text-xs md:text-sm font-semibold text-slate-200">
                        白話錯因分析與客觀評語 (助教可一鍵複製貼回教務/成績系統):
                    </label>
                </div>

                <button type="button" onclick="copyFeedbackText()" id="copyFeedbackBtn"
                    class="px-3 py-1.5 rounded-lg bg-blue-600 hover:bg-blue-500 text-white text-xs font-medium shadow-md transition flex items-center gap-1.5">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
                    </svg>
                    <span id="copyFeedbackText">一鍵複製評語</span>
                </button>
            </div>

            <div class="relative">
                <textarea id="feedbackText" rows="2"
                    class="w-full bg-[#0d131e] text-amber-200/90 border border-borderMuted rounded-lg p-3 text-sm focus:outline-none focus:ring-1 focus:ring-blue-500 font-sans resize-none leading-relaxed transition"
                    placeholder="分析後將在此自動生成簡明精確的錯因回饋..."></textarea>
            </div>
        </section>

    </main>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-6 right-6 px-4 py-2.5 rounded-lg bg-emerald-600 text-white text-xs font-medium shadow-xl flex items-center gap-2 transform translate-y-20 opacity-0 transition-all duration-300 pointer-events-none z-50">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
        </svg>
        <span id="toastMsg">已複製至剪貼簿！</span>
    </div>

    <script>
        const PRESETS = {
            prime_modulo_error: {
                prompt: "寫一個程式印出 100 以內的所有質數 (Prime Numbers)。",
                student: `primes = []\n\nfor num in range(2, 100):\n    is_prime = True\n    for i in range(2, int(num**0.5) + 1):\n        if num % i == 1:\n            is_prime = False\n            break\n    if is_prime:\n        primes.append(num)\n\nprint(primes)`
            },
            tree_missing_print: {
                prompt: "請用字元 '*' 印出一個 5 層的聖誕樹圖案。",
                student: `layers = 5  # 定義樹的層數\n\nfor i in range(1, layers + 1):\n    spaces = ' ' * (layers - i)\n    stars = '*' * (2 * i - 1)`
            },
            missing_loop: {
                prompt: "請撰寫一函式 sum_squares(n)，計算並回傳 1 到 n 所有整數的平方和 (1^2 + 2^2 + ... + n^2)。【要求】：必須使用迴圈結構 (for 或 while) 進行累加。",
                student: `def sum_squares(n):\n    total = n * n\n    return total`
            }
        };

        const studentCodeEl = document.getElementById('studentCode');
        const repairedCodeViewEl = document.getElementById('repairedCodeView');
        const feedbackTextEl = document.getElementById('feedbackText');
        let latestRepairedRawCode = "";

        window.addEventListener('DOMContentLoaded', () => {
            runInstantEngine();
        });

        // 核心：0 秒本地光速規則引擎
        function runInstantEngine() {
            const rawCode = studentCodeEl.value;
            const trimmed = rawCode.trim();

            if (!trimmed) {
                latestRepairedRawCode = "";
                repairedCodeViewEl.innerHTML = '<span class="text-slate-500"># 請在左側輸入學生作答代碼...</span>';
                feedbackTextEl.value = "尚未輸入代碼。";
                updateStatusBadge("待輸入", "text-[11px] px-2 py-0.5 rounded bg-slate-800 text-slate-400 font-mono border border-slate-700");
                document.getElementById('diffStats').textContent = "0 處修復";
                return;
            }

            // 規則 1：質數判斷餘數誤寫為 == 1
            if (rawCode.includes('%') && rawCode.includes('== 1')) {
                const repaired = rawCode.replace(/==\s*1/g, '== 0');
                applyRepairResult(
                    repaired,
                    "整除餘數判斷錯誤 (-3分)",
                    "將 == 1 改為 == 0 (1 處修復)",
                    "【扣分原因】：因數整除條件應為餘數為 0 (`num % i == 0`)，原程式誤寫為 `== 1`。只需將 1 改為 0 即可正確過濾質數。"
                );
            } 
            // 規則 2：聖誕樹缺少 print 輸出
            else if (rawCode.includes('stars =') && !rawCode.includes('print(')) {
                const repaired = rawCode + "\n    print(spaces + stars)";
                applyRepairResult(
                    repaired,
                    "迴圈缺少輸出語句 (-2分)",
                    "新增 1 行 print(spaces + stars)",
                    "【扣分原因】：迴圈內已組裝好空格與星號字串，但缺少 `print()` 輸出，導致畫面上沒有印出樹狀圖。"
                );
            } 
            // 規則 3：缺少迴圈結構
            else if (rawCode.includes('def sum_squares') && !rawCode.includes('for') && !rawCode.includes('while')) {
                const repaired = `def sum_squares(n):\n    total = 0\n    for i in range(1, n + 1):\n        total += i * i\n    return total`;
                applyRepairResult(
                    repaired,
                    "未依要求使用迴圈 (-10分)",
                    "加入 for 迴圈逐一累加 (3 行修復)",
                    "【扣分原因】：題目要求必須使用迴圈結構進行累加，原程式僅計算 `n * n`，未做 1 到 n 的連續平方累加。"
                );
            } 
            // 預設：邏輯正確
            else {
                applyRepairResult(
                    rawCode,
                    "程式邏輯完整 (滿分)",
                    "0 處變動",
                    "【評語】：語法與邏輯正確，符合題目規範要求。"
                );
            }
        }

        function renderDiffHighlight(originalCode, repairedCode) {
            const origLines = originalCode.split('\n');
            const repLines = repairedCode.split('\n');

            const m = origLines.length;
            const n = repLines.length;
            const dp = Array.from({ length: m + 1 }, () => new Uint16Array(n + 1));

            for (let i = 0; i < m; i++) {
                for (let j = 0; j < n; j++) {
                    if (origLines[i].trimEnd() === repLines[j].trimEnd()) {
                        dp[i + 1][j + 1] = dp[i][j] + 1;
                    } else {
                        dp[i + 1][j + 1] = Math.max(dp[i + 1][j], dp[i][j + 1]);
                    }
                }
            }

            let i = m, j = n;
            const isRepairedLineModified = new Array(n).fill(true);

            while (i > 0 && j > 0) {
                if (origLines[i - 1].trimEnd() === repLines[j - 1].trimEnd()) {
                    isRepairedLineModified[j - 1] = false;
                    i--;
                    j--;
                } else if (dp[i - 1][j] >= dp[i][j - 1]) {
                    i--;
                } else {
                    j--;
                }
            }

            const htmlLines = repLines.map((line, idx) => {
                const escapedLine = line
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;') || '&nbsp;';

                if (isRepairedLineModified[idx]) {
                    return `<div class="bg-[#3d161a]/90 text-[#f87171] font-semibold px-1 rounded-sm border-l-2 border-red-500">${escapedLine}</div>`;
                } else {
                    return `<div class="px-1 text-slate-300">${escapedLine}</div>`;
                }
            });

            repairedCodeViewEl.innerHTML = htmlLines.join('');
        }

        function updateStatusBadge(statusText, className) {
            const badge = document.getElementById('repairStatusBadge');
            if (badge) {
                badge.textContent = statusText;
                if (className) badge.className = className;
            }
        }

        function applyRepairResult(repairedCode, statusBadge, statsText, feedbackText) {
            latestRepairedRawCode = repairedCode;
            renderDiffHighlight(studentCodeEl.value, repairedCode);
            feedbackTextEl.value = feedbackText;
            document.getElementById('diffStats').textContent = statsText;

            let badgeClass = "text-[11px] px-2 py-0.5 rounded bg-blue-500/20 text-blue-300 font-mono border border-blue-500/30 shrink-0";
            if (statusBadge.includes('滿分')) {
                badgeClass = "text-[11px] px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-300 font-mono border border-emerald-500/30 shrink-0";
            } else if (statusBadge.includes('-') || statusBadge.includes('錯誤')) {
                badgeClass = "text-[11px] px-2 py-0.5 rounded bg-amber-500/20 text-amber-300 font-mono border border-amber-500/30 shrink-0";
            }
            updateStatusBadge(statusBadge, badgeClass);
        }

        function loadPreset(presetKey) {
            const p = PRESETS[presetKey];
            if (!p) return;
            if (p.prompt && document.getElementById('problemPrompt')) {
                document.getElementById('problemPrompt').value = p.prompt;
            }
            studentCodeEl.value = p.student;
            runInstantEngine();
            showToast("已光速載入案例！");
        }

        function clearStudentCode() {
            studentCodeEl.value = "";
            runInstantEngine();
            studentCodeEl.focus();
        }

        // 只要一打字或一貼上，0秒瞬間反應
        studentCodeEl.addEventListener('input', () => {
            runInstantEngine();
        });

        function copyRepairedCode() {
            executeCopy(latestRepairedRawCode || repairedCodeViewEl.textContent, "已複製修復程式碼！");
            const btnText = document.getElementById('copyCodeText');
            btnText.textContent = "已複製！";
            setTimeout(() => { btnText.textContent = "複製修復程式碼"; }, 1500);
        }

        function copyFeedbackText() {
            executeCopy(feedbackTextEl.value, "已複製學生錯因評語！");
            const btnText = document.getElementById('copyFeedbackText');
            btnText.textContent = "已複製評語！";
            setTimeout(() => { btnText.textContent = "一鍵複製評語"; }, 1500);
        }

        function executeCopy(text, toastMessage) {
            try {
                const textarea = document.createElement('textarea');
                textarea.value = text;
                textarea.style.position = 'fixed';
                textarea.style.opacity = '0';
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                showToast(toastMessage);
            } catch (err) {
                console.error("Copy failed", err);
            }
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').textContent = msg;
            toast.classList.remove('translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');
            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 1800);
        }
    </script>
</body>
</html>
