<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python 程式批改輔助系統 | Minimal Repair Engine</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans TC', sans-serif; }
        .code-font { font-family: 'Fira Code', monospace; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">

    <!-- 頂部導覽列 -->
    <header class="bg-slate-800 border-b border-slate-700 px-6 py-4 flex flex-wrap justify-between items-center shadow-md">
        <div class="flex items-center space-x-3">
            <div class="bg-indigo-600 p-2 rounded-lg text-white font-bold">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4" />
                </svg>
            </div>
            <div>
                <h1 class="text-lg font-bold tracking-wide">Python 程式批改輔助系統 <span class="text-xs bg-indigo-500/20 text-indigo-400 px-2 py-0.5 rounded border border-indigo-500/30 ml-2">Minimal Repair Engine</span></h1>
                <p class="text-xs text-slate-400">保留學生原始邏輯，最小幅度修正，快速診斷評語生成</p>
            </div>
        </div>

        <!-- API Key 設定區塊 -->
        <div class="flex items-center space-x-2 mt-2 sm:mt-0">
            <span class="text-xs text-slate-400">API Key:</span>
            <input type="password" id="apiKeyInput" placeholder="可貼入 Gemini API Key" class="bg-slate-900 border border-slate-700 rounded px-3 py-1 text-xs text-slate-200 focus:outline-none focus:border-indigo-500 w-48">
            <button onclick="saveApiKey()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-1 rounded text-xs font-medium transition">儲存</button>
        </div>
    </header>

    <!-- 主要工作區 -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-6 grid grid-cols-1 lg:grid-cols-2 gap-6">

        <!-- 左側：學生程式碼輸入區 -->
        <div class="flex flex-col space-y-4">
            <div class="bg-slate-800 border border-slate-700 rounded-xl p-4 flex flex-col flex-1 shadow-lg">
                <div class="flex justify-between items-center mb-2">
                    <label class="text-sm font-semibold text-slate-300 flex items-center">
                        <span class="w-2.5 h-2.5 rounded-full bg-amber-500 mr-2"></span>
                        學生程式碼 Student Code (可即時編輯)
                    </label>
                    <div class="space-x-2">
                        <button onclick="loadSample(1)" class="text-xs bg-slate-700 hover:bg-slate-600 px-2 py-1 rounded text-slate-300 transition">範例 1: 算數判斷</button>
                        <button onclick="loadSample(2)" class="text-xs bg-slate-700 hover:bg-slate-600 px-2 py-1 rounded text-slate-300 transition">範例 2: 聖誕樹 (少 print)</button>
                        <button onclick="clearCode()" class="text-xs text-slate-400 hover:text-white px-2 py-1 transition">清空</button>
                    </div>
                </div>
                <textarea id="studentCode" class="code-font flex-1 bg-slate-950 border border-slate-800 rounded-lg p-4 text-sm text-emerald-400 focus:outline-none focus:border-indigo-500 resize-none min-h-[300px]" placeholder="# 請在此貼上學生提交的程式碼..."></textarea>
                
                <div class="mt-4">
                    <button onclick="runDiagnostic()" class="w-full bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-medium py-2.5 px-4 rounded-lg shadow transition flex items-center justify-center space-x-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
                        </svg>
                        <span>立即由 AI 診斷修復</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- 右側：Minimal Repair 修復與白話解析區 -->
        <div class="flex flex-col space-y-4">
            <!-- 最小修復對照 -->
            <div class="bg-slate-800 border border-slate-700 rounded-xl p-4 flex flex-col flex-1 shadow-lg">
                <div class="flex justify-between items-center mb-2">
                    <label class="text-sm font-semibold text-slate-300 flex items-center">
                        <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 mr-2"></span>
                        Minimal Repair (最小修復對照)
                    </label>
                    <span id="repairStatus" class="text-xs text-slate-400 bg-slate-900 px-2.5 py-1 rounded border border-slate-700">等待診斷中...</span>
                </div>
                <div id="repairedCodeOutput" class="code-font flex-1 bg-slate-950 border border-slate-800 rounded-lg p-4 text-sm text-slate-300 overflow-x-auto min-h-[200px] whitespace-pre-wrap">請點擊下方按鈕進行 AI 最小修復批改。</div>
            </div>

            <!-- 白話細因分析與客觀評語 -->
            <div class="bg-slate-800 border border-slate-700 rounded-xl p-4 shadow-lg">
                <div class="flex justify-between items-center mb-2">
                    <label class="text-sm font-semibold text-slate-300 flex items-center">
                        <span class="w-2.5 h-2.5 rounded-full bg-indigo-500 mr-2"></span>
                        白話細因分析與客觀評語 (助教可一鍵複製貼回教務/成績系統)
                    </label>
                    <button onclick="copyFeedback()" class="text-xs bg-slate-700 hover:bg-slate-600 text-slate-200 px-2.5 py-1 rounded transition flex items-center space-x-1">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3" />
                        </svg>
                        <span>一鍵複製評語</span>
                    </button>
                </div>
                <div id="feedbackOutput" class="bg-slate-950 border border-slate-800 rounded-lg p-3 text-xs text-slate-300 min-h-[80px] leading-relaxed">
                    尚無解析。本工具採用 Minimal Repair 原則，專責「語法與輸出漏洞（如缺 print）」修復；數學圖形邏輯（如聖誕樹公式）建議搭配前 7 題觀念測驗或人工複查雙重把關。
                </div>
            </div>
        </div>
    </main>

    <script>
        // 載入預設 API Key
        window.onload = function() {
            const savedKey = localStorage.getItem('gemini_api_key');
            if (savedKey) {
                document.getElementById('apiKeyInput').value = savedKey;
            }
        };

        function saveApiKey() {
            const key = document.getElementById('apiKeyInput').value.trim();
            localStorage.setItem('gemini_api_key', key);
            alert('API Key 已儲存至本地瀏覽器！');
        }

        // 範例資料
        const samples = {
            1: `x = 10\nif x > 5\n    print("Greater")`,
            2: `layers = 5  # 定義樹的層數\n\nfor i in range(1, layers + 1):\n    spaces = ' ' * (layers - i)\n    stars = '*' * (2 * i + 1)`
        };

        function loadSample(id) {
            document.getElementById('studentCode').value = samples[id];
        }

        function clearCode() {
            document.getElementById('studentCode').value = '';
            document.getElementById('repairedCodeOutput').innerText = '已清除';
            document.getElementById('feedbackOutput').innerText = '尚無解析。';
        }

        async function runDiagnostic() {
            const apiKey = document.getElementById('apiKeyInput').value.trim();
            const code = document.getElementById('studentCode').value.trim();

            if (!apiKey) {
                alert('請先於右上角填入您的 Gemini API Key！');
                return;
            }
            if (!code) {
                alert('請先輸入或載入學生的程式碼！');
                return;
            }

            document.getElementById('repairStatus').innerText = 'AI 診斷修復中...';
            document.getElementById('repairedCodeOutput').innerText = '正在透過 Minimal Repair 引擎分析...';

            const prompt = `你是一個嚴格且精準的 Python 程式 Minimal Repair（最小修復）助教引擎。
請對以下學生提交的程式碼進行最小幅度的語法與輸出修復（例如補上遺漏的冒號、括號、縮排或 print 輸出）。
不准改變學生原本的變數命名與核心邏輯架構。

學生原始程式碼：
\`\`\`python
${code}
\`\`\`

請回傳一個嚴格的 JSON 格式（不要使用 markdown codeblock 包覆，直接輸出純 JSON 字串），包含兩個欄位：
1. "repaired_code": 修復後的完整 Python 程式碼字串。
2. "feedback": 白話繁體中文評語（說明扣分原因與修復了什麼，例如缺少 print 或冒號）。`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }]
                    })
                });

                const data = await response.json();
                if (data.error) {
                    throw new Error(data.error.message);
                }

                let text = data.candidates[0].content.parts[0].text;
                // 清理可能的 markdown 標記
                text = text.replace(/```json/g, '').replace(/```/g, '').trim();
                const result = JSON.parse(text);

                document.getElementById('repairedCodeOutput').innerText = result.repaired_code;
                document.getElementById('feedbackOutput').innerText = result.feedback;
                document.getElementById('repairStatus').innerText = '修復完成 (Minimal Repair)';

            } catch (error) {
                console.error(error);
                document.getElementById('repairStatus').innerText = '診斷失敗';
                document.getElementById('repairedCodeOutput').innerText = '錯誤：' + error.message;
            }
        }

        function copyFeedback() {
            const feedbackText = document.getElementById('feedbackOutput').innerText;
            navigator.clipboard.writeText(feedbackText).then(() => {
                alert('已成功複製評語！');
            });
        }
    </script>
</body>
</html>
